apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-digest-optin
  annotations:
    policies.kyverno.io/title: Require digest by namespace opt-in
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >
      Audit namespace opt-in nếu image chưa pin digest bằng @sha256. Không áp rộng toàn cụm ở vòng đầu.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: isTargetNamespace
      expression: namespaceObject.metadata.name in ["default", "outline", "rnd-grafana", "soar", "vaultwarden"]
    - name: requireDigest
      expression: namespaceObject.metadata.name in ["default", "outline", "rnd-grafana", "soar", "vaultwarden"]
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >
        !variables.isTargetNamespace || !variables.requireDigest ||
        variables.allContainers.all(c, c.image.contains("@sha256:"))
      message: Images in the target namespaces must be pinned by digest.
