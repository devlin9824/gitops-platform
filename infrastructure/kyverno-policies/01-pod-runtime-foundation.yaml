apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-runtime-foundation
  annotations:
    policies.kyverno.io/title: Pod runtime foundation
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >
      Audit các control runtime cơ bản cho các namespace mục tiêu: allowPrivilegeEscalation,
      runAsNonRoot và seccomp RuntimeDefault/Localhost.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: isTargetNamespace
      expression: namespaceObject.metadata.name in ["default", "outline", "rnd-grafana", "soar", "vaultwarden"]
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >
        !variables.isTargetNamespace ||
        variables.allContainers.all(c,
          c.?securityContext.?allowPrivilegeEscalation.orValue(false) == false
        )
      message: Containers in target namespaces should set allowPrivilegeEscalation=false.
    - expression: >
        !variables.isTargetNamespace ||
        (
          object.spec.?securityContext.?runAsNonRoot.orValue(false) == true ||
          variables.allContainers.all(c,
            c.?securityContext.?runAsNonRoot.orValue(false) == true ||
            c.?securityContext.?runAsUser.orValue(0) > 0
          )
        )
      message: Pods should set runAsNonRoot=true at pod or container level, or set a non-zero runAsUser.
    - expression: >
        !variables.isTargetNamespace ||
        (
          object.spec.?securityContext.?seccompProfile.?type.orValue("") in ["RuntimeDefault", "Localhost"] ||
          variables.allContainers.all(c,
            c.?securityContext.?seccompProfile.?type.orValue("") in ["RuntimeDefault", "Localhost"]
          )
        )
      message: Pods should use seccompProfile RuntimeDefault or Localhost.
