apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: secret-env-guardrails
  annotations:
    policies.kyverno.io/title: Secret environment guardrails
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >
      Audit các namespace mục tiêu nếu biến môi trường có tên giống secret nhưng không dùng secretKeyRef.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: isTargetNamespace
      expression: namespaceObject.metadata.name in ["default", "outline", "rnd-grafana", "soar", "vaultwarden"]
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
    - name: secretLike
      expression: '["PASSWORD", "PASS", "TOKEN", "SECRET", "KEY", "PRIVATE_KEY", "ACCESS_KEY", "CLIENT_SECRET"]'
  validations:
    - expression: >
        !variables.isTargetNamespace ||
        variables.allContainers.all(c,
          c.?env.orValue([]).all(e,
            !variables.secretLike.exists(k, e.name.upperAscii().contains(k)) ||
            (has(e.valueFrom) && has(e.valueFrom.secretKeyRef))
          )
        )
      message: Secret-like environment variables should use valueFrom.secretKeyRef.
