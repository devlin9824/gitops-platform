apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-default-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow default service account
    policies.kyverno.io/category: Identity
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >
      Audit các namespace mục tiêu nếu Pod dùng default ServiceAccount.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, daemonsets, statefulsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: isTargetNamespace
      expression: namespaceObject.metadata.name in ["default", "outline", "rnd-grafana", "soar", "vaultwarden"]
  validations:
    - expression: >
        !variables.isTargetNamespace || object.spec.?serviceAccountName.orValue("default") != "default"
      message: Pods in target namespaces should not use the default ServiceAccount.
