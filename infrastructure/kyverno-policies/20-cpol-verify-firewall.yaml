apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-firewall-service-signature
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "index.docker.io/d4vlin/firewall-service@sha256:*"
          attestors:
            - entries:
                - keys:
                    publicKeys: |
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEpfbmFhkNwTCo468eu0JniiHtM5WG
                      DbAFOkI4pI1pANrk5T+mhcJT1HWr9+vBuzdTCPpXL9sgkrqT6sUCGPe2hw==
                      -----END PUBLIC KEY-----
          mutateDigest: false
